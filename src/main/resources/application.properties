server.port=8080
server.tomcat.max-swallow-size=-1
server.tomcat.connection-timeout=3600000
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
spring.application.name=Tennant-Ari Gallery

# H2 Database
spring.datasource.url=jdbc:h2:file:./gallery-db;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# File Upload Settings (supports up to ~10GB)
spring.servlet.multipart.max-file-size=10GB
spring.servlet.multipart.max-request-size=10GB

# Custom Properties
gallery.upload-dir=uploads
gallery.ffmpeg.path=ffmpeg
gallery.access.pin=233482

# Admin Credentials (change these!)
gallery.admin.username=admin
gallery.admin.password=changeme

# Google Drive Backup (optional - set to true to enable)
gallery.drive.enabled=false
gallery.drive.credentials-path=credentials.json
gallery.drive.token-path=token.json
gallery.drive.root-folder-name=Tennant-Ari Gallery
