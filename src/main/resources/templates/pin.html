<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter PIN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pin-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div class="pin-card text-center">
        <i class="bi bi-lock-fill display-4 text-primary mb-3"></i>
        <h4 class="mb-1">Tennant-Ari Gallery</h4>
        <p class="text-muted mb-4">Enter the access PIN to continue</p>
        <div th:if="${error}" class="alert alert-danger py-2 small" role="alert">
            <i class="bi bi-exclamation-triangle me-1"></i><span th:text="${error}"></span>
        </div>
        <form method="post" th:action="@{/pin}">
            <div class="mb-3">
                <input type="password" name="pin" class="form-control form-control-lg text-center"
                       placeholder="PIN" inputmode="numeric" autofocus required maxlength="10">
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100">
                <i class="bi bi-unlock me-1"></i>Enter
            </button>
        </form>
    </div>
</body>
</html>
